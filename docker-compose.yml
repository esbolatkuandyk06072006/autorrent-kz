services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: autorrent
      POSTGRES_USER: autorrent
      POSTGRES_PASSWORD: autorrent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autorrent -d autorrent"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://db:5432/autorrent
      DB_USER: autorrent
      DB_PASSWORD: autorrent
      JWT_SECRET: change-me-in-production-please-use-32-bytes-minimum-secret-key
      APP_SEED_ENABLED: "true"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
