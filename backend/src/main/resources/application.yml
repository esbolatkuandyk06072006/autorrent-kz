spring:
  application:
    name: autorrent-kz

  datasource:
    url: jdbc:h2:mem:autorrent;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: false

  h2:
    console:
      enabled: true
      path: /h2-console

  jackson:
    serialization:
      write-dates-as-timestamps: false

  data:
    web:
      pageable:
        max-page-size: 50
        default-page-size: 10

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-please-use-32-bytes-minimum-secret-key}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}
  seed:
    enabled: ${APP_SEED_ENABLED:true}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

logging:
  level:
    org.hibernate.SQL: warn
    org.springframework.security: warn
