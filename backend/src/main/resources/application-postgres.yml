spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/autorrent}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:autorrent}
    password: ${DB_PASSWORD:autorrent}

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  h2:
    console:
      enabled: false

app:
  seed:
    enabled: ${APP_SEED_ENABLED:true}
