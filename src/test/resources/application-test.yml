spring:
  datasource:
    url: jdbc:h2:mem:autorrent-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

  flyway:
    enabled: false

app:
  seed:
    enabled: false
  jwt:
    secret: test-secret-key-that-is-long-enough-for-hs256-123456
    expiration-seconds: 3600
